<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Roboto+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#16181B;font-family:Inter,sans-serif;color:#F7F7F5;-webkit-font-smoothing:antialiased}a{color:#F2A900}a:hover{color:#F7F7F5}*{box-sizing:border-box}</style></helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;">
<dc-import name="SiteHeader" hint-size="100%,60px" style="position:sticky;top:0;z-index:20;display:block;"></dc-import>
<section style="flex:1;max-width:1080px;width:100%;margin:0 auto;padding:clamp(48px,10vw,120px) clamp(20px,4vw,40px);display:flex;flex-direction:column;align-items:flex-start;gap:24px;">
<div style="background:#0E5C3A;border-radius:10px;padding:6px;">
<div style="border:3px solid #F7F7F5;border-radius:6px;padding:18px 28px 14px;display:flex;flex-direction:column;gap:4px;">
<span style="font-family:'Barlow Condensed','Roboto Condensed',sans-serif;font-weight:800;font-size:clamp(20px,3vw,26px);letter-spacing:.06em;color:#F2A900;">EXIT 404</span>
<span style="font-family:'Barlow Condensed','Roboto Condensed',sans-serif;font-weight:800;font-size:clamp(40px,8vw,84px);line-height:.9;text-transform:uppercase;">Road closed</span>
</div>
</div>
<p style="margin:0;font-size:18px;line-height:1.55;color:#D4D6DA;max-width:520px;">This page doesn't exist or has moved. Take one of these exits instead.</p>
<div style="display:flex;flex-wrap:wrap;gap:10px;">
<sc-for list="{{ exits }}" as="e" hint-placeholder-count="4"><a href="{{ e.href }}" style="height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;border-radius:10px;border:2px solid rgba(247,247,245,.4);color:#F7F7F5;text-decoration:none;font-family:'Barlow Condensed','Roboto Condensed',sans-serif;font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;" style-hover="border-color:#F2A900;color:#F2A900;">{{ e.name }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a></sc-for>
</div>
<a href="tel:+1XXXXXXXXXX" style="font-size:16px;font-weight:600;">Or call dispatch 24/7: (XXX) XXX-XXXX</a>
</section>
<dc-import name="SiteFooter" hint-size="100%,360px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { exits: [['Home', 'Homepage.dc.html'], ['Dispatch', 'Dispatch.dc.html'], ['CDL jobs', 'Jobs.dc.html'], ['Carrier Lookup', 'Carrier Lookup.dc.html']].map(([name, href]) => ({ name, href })) };
  }
}
</script>
</body>
</html>
