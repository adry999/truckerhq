<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="design_doc_mode" content="canvas"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Roboto+Condensed:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#E9EAE6;font-family:Inter,sans-serif;color:#16181B}a{color:#0E5C3A}a:hover{color:#16181B}</style></helmet>
<section style="padding:48px;display:flex;flex-direction:column;gap:28px;">
<div style="display:flex;flex-direction:column;gap:6px;max-width:760px;">
<div style="font-family:'Barlow Condensed','Roboto Condensed',sans-serif;font-weight:800;font-size:32px;text-transform:uppercase;">Mobile previews</div>
<div style="font-size:15px;line-height:1.5;color:#3F444B;">Every page at 390 px wide, the size of most iPhones. Each screen is live: scroll inside it, tap buttons and fill forms.</div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:40px 32px;">
<sc-for list="{{ pages }}" as="p" hint-placeholder-count="13">
<div id="{{ p.id }}" style="display:flex;flex-direction:column;gap:10px;">
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:414px;">
<div style="display:flex;align-items:center;gap:10px;"><span style="background:#16181B;color:#F2A900;font-family:'Barlow Condensed','Roboto Condensed',sans-serif;font-weight:800;font-size:15px;padding:3px 8px;border-radius:4px;">{{ p.id }}</span><span style="font-family:'Barlow Condensed','Roboto Condensed',sans-serif;font-weight:800;font-size:22px;text-transform:uppercase;">{{ p.name }}</span></div>
<a href="{{ p.file }}" style="font-size:13px;">Open full page</a>
</div>
<div style="width:414px;height:868px;box-sizing:border-box;padding:12px;border-radius:52px;background:#16181B;box-shadow:0 10px 30px rgba(0,0,0,.18);">
<div style="width:390px;height:844px;border-radius:40px;overflow:hidden;background:#F7F7F5;">
<iframe src="{{ p.file }}" loading="lazy" title="{{ p.name }} on mobile" style="width:390px;height:844px;border:0;display:block;"></iframe>
</div>
</div>
</div>
</sc-for>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['Homepage', 'Homepage.dc.html'], ['Dispatch', 'Dispatch.dc.html'], ['Start dispatch', 'Dispatch Onboarding.dc.html'],
      ['Jobs', 'Jobs.dc.html'], ['Hire drivers', 'Hire Drivers.dc.html'], ['Tools', 'Tools.dc.html'],
      ['Carrier Lookup', 'Carrier Lookup.dc.html'], ['Profit per mile', 'Profit Calculator.dc.html'], ['Compliance Alerts', 'Compliance Alerts.dc.html'],
      ['New MC Checklist', 'New MC Checklist.dc.html'], ['Texas carriers', 'State Texas.dc.html'], ['Resources', 'Resources.dc.html'], ['About / Contact', 'About.dc.html'],
    ];
    return { pages: list.map(([name, file], i) => ({ name, file, id: 'M' + String(i + 1).padStart(2, '0') })) };
  }
}
</script>
</body>
</html>
